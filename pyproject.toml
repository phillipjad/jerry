[project]
name = "jerry"
version = "1.0.0.dev0"
description = "Project-based work for Claude Code: multi-project discovery, per-session focus and nested projects"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Phillip Miavelstuck" },
    { name = "Jerry Framework Contributors" },
]
dependencies = [
    "markdown-it-py>=4.2.0,<5.0.0",
    "mdformat>=1.0.0,<2.0.0",
]

[project.scripts]
jerry = "jerry.cli:main"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jerry"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "happy_path: expected-input scenario",
    "negative: invalid-input scenario",
    "edge_case: boundary scenario",
]

[tool.coverage.run]
source = ["jerry"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

